:root {
  /* светлая бело-чёрная тема */
  --page: #ffffff;
  --page-hatch: rgba(0, 0, 0, .045);
  --glass: rgba(255, 255, 255, .36);       /* тонированное стекло панели без размытия: поле точек фона читается сквозь него */
  --mod-bg: rgba(0, 0, 0, .035);           /* модуль на стекле: лёгкая тонировка, фон просвечивает */
  --mod-surface: rgba(255, 255, 255, .3);
  --card: rgba(255, 255, 255, .6);         /* запись списка полупрозрачная: фон виден и под списком */
  --frame: #141414;
  --frame-2: #202020;
  --frame-fg: #f4f4f4;
  --frame-mute: #8d8d8d;
  --frame-line: rgba(255, 255, 255, .08);
  --frame-active: rgba(255, 255, 255, .11);
  --panel: #ffffff;
  --shell: #f2f2f2;
  --surface: #ffffff;
  --surface-2: #f6f6f6;
  --surface-3: #ededed;
  --line: #e5e5e5;
  --line-2: #d4d4d4;
  --fg: #111111;
  --fg-2: #474747;
  --mute: #8a8a8a;
  --primary: #111111;
  --primary-fg: #ffffff;
  --ok: #1f9d55;
  --ok-bg: #e7f6ee;
  --warn: #b86e00;
  --warn-bg: #fff3dd;
  --bad: #cf3338;
  --bad-bg: #fdeaea;
  --veil: rgba(255, 255, 255, .28);
  --shadow: 0 12px 30px rgba(0, 0, 0, .14), 0 2px 6px rgba(0, 0, 0, .06);
  --frame-shadow: 0 30px 80px rgba(0, 0, 0, .28);
  --logo-bg: #ffffff;
  --logo-fg: #111111;
  --bg-dot: rgba(17, 17, 17, .85);
}

:root[data-theme="dark"] {
  /* тёмная чёрно-белая тема */
  --page: #0a0a0a;
  --page-hatch: rgba(255, 255, 255, .05);
  --glass: rgba(10, 10, 10, .45);
  --mod-bg: rgba(255, 255, 255, .03);
  --mod-surface: rgba(10, 10, 10, .35);
  --card: rgba(13, 13, 13, .62);
  --frame: #171717;
  --frame-2: #222222;
  --frame-fg: #f2f2f2;
  --frame-mute: #8a8a8a;
  --frame-line: rgba(255, 255, 255, .08);
  --frame-active: rgba(255, 255, 255, .12);
  --panel: #0a0a0a;
  --shell: #151515;
  --surface: #0d0d0d;
  --surface-2: #161616;
  --surface-3: #1f1f1f;
  --line: #262626;
  --line-2: #363636;
  --fg: #f0f0f0;
  --fg-2: #c4c4c4;
  --mute: #7f7f7f;
  --primary: #f2f2f2;
  --primary-fg: #111111;
  --ok: #3ccf7a;
  --ok-bg: rgba(60, 207, 122, .13);
  --warn: #f0a63a;
  --warn-bg: rgba(240, 166, 58, .14);
  --bad: #f06a6a;
  --bad-bg: rgba(240, 106, 106, .14);
  --veil: rgba(0, 0, 0, .38);
  --shadow: 0 12px 30px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .5);
  --frame-shadow: 0 30px 80px rgba(0, 0, 0, .8), 0 0 0 1px #262626;
  --logo-bg: #ffffff;
  --logo-fg: #111111;
  --bg-dot: rgba(240, 240, 240, .7);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--page);
  color: var(--fg);
  font: 12px/1.4 "SN Pro", "SN Pro Local", Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  min-width: 1100px;
}
::selection { background: var(--fg); color: var(--panel); }
.grid, .chat-msgs, .xp-panel .pb { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; scroll-behavior: smooth; }
.grid::-webkit-scrollbar, .chat-msgs::-webkit-scrollbar { width: 8px; }
.grid::-webkit-scrollbar-thumb, .chat-msgs::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--panel); }
.grid::-webkit-scrollbar-track, .chat-msgs::-webkit-scrollbar-track { background: transparent; }
button, input { font: inherit; }
a { color: inherit; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
svg.i.xs { width: 11px; height: 11px; }
/* стеклянные иконки: размеры по месту */
.gi { width: 20px; height: 20px; display: block; overflow: visible; flex: none; }
.gi.md { width: 18px; height: 18px; }
.gi.sm { width: 15px; height: 15px; }
.gi.xs { width: 13px; height: 13px; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.small { font-size: 11px; }
.xsmall { font-size: 10px; }
.b { font-weight: 600; }
.row { display: flex; align-items: center; gap: 7px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- фон приложения: слои под рамкой (штриховка, волны на canvas), выбранный проявляется, остальные гаснут ---------- */
/* width/height 100% обязательны: canvas — замещаемый элемент, и при inset: 0 без размеров он показывается в собственном размере
   (innerWidth × devicePixelRatio), при масштабе экрана 150–200 % поле точек целиком уходило за нижний край окна */
.bg-layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease; }
.bg-hatch { background-image: repeating-linear-gradient(135deg, var(--page-hatch) 0 1px, transparent 1px 9px); }
html[data-bg="hatch"] .bg-hatch, html[data-bg="waves"] #bg-wave { opacity: 1; }
.xp-panel.rail { left: calc(100% + 10px); bottom: 0; }
.xp.open [data-tip]:hover::after, .xp.open [data-tip]:hover::before { display: none; }

/* ---------- оболочка: рамка 20px от края, контент 6px сверху/справа/снизу ---------- */
.frame {
  --side-w: 52px; --gap: 6px;
  position: fixed; inset: 20px;
  background: transparent;
  border-radius: 18px;
  box-shadow: var(--frame-shadow);
  display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr);
  color: var(--fg);
}
/* чёрное окно — один слой с прямоугольным вырезом под панель страницы (углы выреза закрывает кольцо панели):
   стекло панели видит сквозь вырез фон окна, а не чёрный; слева кольцо сливается с колонкой меню без зазоров */
.frame::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--frame);
  -webkit-mask: linear-gradient(#000 0 0) var(--side-w) var(--gap) / calc(100% - var(--side-w) - var(--gap)) calc(100% - 2 * var(--gap)) no-repeat, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) var(--side-w) var(--gap) / calc(100% - var(--side-w) - var(--gap)) calc(100% - 2 * var(--gap)) no-repeat, linear-gradient(#000 0 0);
  mask-composite: exclude;
}
/* панель страницы: почти прозрачное стекло поверх фона окна; чёрное кольцо 6px рисует box-shadow */
.content {
  position: relative;
  margin: var(--gap) var(--gap) var(--gap) 0;
  background: transparent;
  border-radius: 13px;
  box-shadow: 0 0 0 var(--gap) var(--frame);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  overflow: clip;   /* обрезает, но не прокручивается: ни scrollIntoView, ни анимации не сдвинут содержимое */
}
/* стекло ниже чёрного слоя окна (z -2 и -1 в контексте .frame): размытие берёт только фон окна */
/* размытие 6px (было 16): сильнее — и фон приложения (волны) сквозь стекло превращается в ровную дымку */
.content::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--glass); -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); }   /* 1px по просьбе владельца (20-й круг, 2px стирало точки радиусом 1px); сильнее — точки фона превращаются в дымку, а пересчёт размытия под анимацией грузит GPU */
@supports not ((mask-composite: exclude) or (-webkit-mask-composite: xor)) {
  .frame { background: var(--frame); }
  .frame::before { display: none; }
}

/* боковая колонка: иконки 20px в плитках 32px, отступы 10px, подписи всплывают справа */
.side { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; min-height: 0; background: var(--frame); border-radius: 18px 0 0 18px; }
.logo-tile { width: 32px; height: 32px; border-radius: 10px; background: var(--logo-bg); color: var(--logo-fg); display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: -.03em; text-decoration: none; }
.dock { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.dk-item { position: relative; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--frame); opacity: .55; text-decoration: none; transition: opacity .15s, background .15s; }
.dk-item { transition: opacity .15s ease, background .2s ease; }   /* без подъёма при наведении: любой transform заново растрирует иконку по окончании */
.dk-item:hover { opacity: 1; }
.dk-item.active { opacity: 1; background: #fff; color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.dk-item .n { position: absolute; top: -4px; right: -4px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 999px; background: #fff; color: #111; font-size: 9px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--frame); font-variant-numeric: tabular-nums; line-height: 1; }
.dk-item.active .n { background: #111; color: #fff; border-color: #fff; }
.rail-btn { position: relative; width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: var(--frame); display: grid; place-items: center; cursor: pointer; opacity: .75; }
.rail-btn:hover { opacity: 1; background: var(--frame-2); }
.rail-me { position: relative; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--frame); opacity: .85; }
.rail-me .on { position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--frame); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
[data-tip] { position: relative; }
[data-tip]:hover { z-index: 80; }
[data-tip]:hover::after, [data-tip]:hover::before { opacity: var(--o); animation: fade-in .14s ease-out both; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); background: var(--fg); color: var(--panel); padding: 5px 9px; border-radius: 7px; font-size: 11px; font-weight: 500; white-space: nowrap; z-index: 80; pointer-events: none; box-shadow: var(--shadow); line-height: 1.3; }
[data-tip]:hover::before { content: ""; position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); border: 4px solid transparent; border-right-color: var(--fg); z-index: 80; pointer-events: none; }

/* верхняя полоса страницы */
/* линия снизу — внутренней тенью, не рамкой: содержимое 48px, плитки 28px встают на целые пиксели (с рамкой было 47px и сдвиг 9,5px) */
.topbar { height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -1px 0 var(--line); flex: none; }
/* плитка 28px с иконкой 20px: иконка на сетке 4px (88/40 от края окна) — целые пиксели устройства при масштабе 125/150/175/200 % */
.tb-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--surface-2); }
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
.tb-sub { color: var(--mute); font-size: 11px; }
.search { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--mute); width: 330px; }
/* два одинаковых переключателя в шапке: организация и направление — одна ширина, подпись слева, стрелка справа */
.btn.sw { width: 200px; justify-content: flex-start; }
.btn.sw .lbl { flex: 1; min-width: 0; text-align: left; }
.menu button.co { height: auto; padding: 6px 8px; }
.search input { border: 0; background: transparent; outline: 0; color: var(--fg); width: 100%; font-size: 11.5px; }
.search input::placeholder { color: var(--mute); }
.search kbd { font: 10px/1 "SN Pro", "SN Pro Local", sans-serif; border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 4px; color: var(--mute); }
.badge-n { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 10px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

/* тело страницы: сетка модулей + якорь чата */
.body { flex: 1; min-height: 0; display: flex; }
.grid { flex: 1; min-width: 0; overflow: auto; padding: 10px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; align-content: start; grid-auto-rows: min-content; }
.grid > * { min-width: 0; }
/* чат: полосы нет, панель раскрывается по кнопке в шапке поверх контента справа */
.chatcol, .notifcol { width: 0; flex: none; position: relative; min-height: 0; }
.chat-pop { top: 10px; bottom: 10px; right: 10px; width: 540px; padding: 0; background: transparent; border: 0; box-shadow: var(--shadow); border-radius: 14px; }
.chat-pop .mod { flex: 1; min-height: 0; background: var(--shell); }   /* панели поверх страницы (чат, уведомления) непрозрачные */
.chat-pop .mod-surface { background: var(--surface); }

/* ---------- модуль: поверхность + подпись снизу (образец -48) ---------- */
.mod { background: var(--mod-bg); border-radius: 14px; padding: 5px; display: flex; flex-direction: column; min-width: 0; }   /* модули на странице полупрозрачные: фон приложения виден сквозь них */
.mod-surface { background: var(--mod-surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px; flex: 1; min-height: 0; position: relative; }
.mod-surface.tight { padding: 6px; }
.mod-cap { display: flex; align-items: center; gap: 8px; padding: 7px 7px 3px; }
.mod-cap .t { font-weight: 600; font-size: 12px; line-height: 1.25; }
.mod-cap .s { color: var(--mute); font-size: 11px; line-height: 1.25; margin-top: 1px; }
.mod-cap .acts { margin-left: auto; display: flex; gap: 4px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; }
.span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }

/* ---------- кнопки, чипы, точки, аватары ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn { transition: background .15s ease, border-color .15s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { background: var(--surface-3); }   /* нажатие — цветом, не масштабом: иначе иконка внутри прыгает после отпускания */
.btn.primary:active { background: var(--fg-2); border-color: var(--fg-2); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.icon { width: 28px; padding: 0; justify-content: center; position: relative; }
.btn.sm { height: 23px; padding: 0 8px; font-size: 11px; border-radius: 6px; }
.btn.sm.icon { width: 23px; }
.btn .dot-n { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); border: 1.5px solid var(--surface); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 500; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.chip.solid { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.dashed { border-style: dashed; background: transparent; color: var(--mute); }
.chip.line { background: transparent; border-color: var(--line-2); }
.chip.dir { background: transparent; border-color: var(--line-2); font-weight: 600; letter-spacing: .01em; }
.chip.dir .dk { width: 12px; height: 12px; border-radius: 3px; background: var(--fg); color: var(--panel); display: grid; place-items: center; font-size: 8px; font-weight: 700; }
.chip.all { background: var(--surface-3); border-color: transparent; }
/* статус заявки — приём стеклянных иконок меню (stChip в ui.js): тёмная задняя фигура 26×16 и цветная метка статуса 10×16
   слева сверху, стеклянная плашка поверх них со сдвигом вправо-вниз; в перекрытии — размытые копии фигур под белой тонировкой,
   по краю блик, под плашкой мягкая тень. Одна ширина 124px (под «заказ создан» с текстом от 48px), текст слева, строчными, 700, углы 6px */
.chip.st { position: relative; width: 124px; height: 20px; padding: 4px 6px 0 48px; border: 0; border-radius: 0; background: none; justify-content: flex-start; font-weight: 700; text-transform: lowercase; color: var(--fg); }
.chip.st .stg { position: absolute; left: 0; top: 0; width: 124px; height: 20px; overflow: visible; pointer-events: none; }
.chip.st .tx { position: relative; line-height: 16px; }
.chip.st-req { --stc: #7B828C; }    /* метки статуса: 22-й круг — оттенки владельца, 23-й — ярче (#9AA3AF, #FF8A1F, #1FBF5A, #2B7FFF), 24-й — темнее на 20 % по яркости; в обеих темах одинаковые */
.chip.st-ord { --stc: #CC6E19; }
.chip.st-tr { --stc: #199948; }
.chip.st-done { --stc: #2266CC; }
.chip.pay-y { --stc: #1F9D6B; }   /* оплата (29-й круг): зелёная — оплачено, красная — не оплачено */
.chip.pay-n { --stc: #C2453C; }
.chip.st.w136, .chip.st.w136 .stg { width: 136px; }
.chip.rk-item { --stc: #2266CC; }   /* производство (31-й круг): изделие — синяя метка, полуфабрикат — фиолетовая */
.chip.rk-semi { --stc: #8A63D2; }
.chip.pz-plan { --stc: #7B828C; }   /* заказ на производство: в плане — серая, в работе — оранжевая, готово — зелёная */
.chip.pz-work { --stc: #CC6E19; }
.chip.pz-done { --stc: #199948; }
.chip.pay-p { --stc: #D9A21B; }   /* продажи (32-й круг): оплата частично — янтарная */
.chip.sk-inv { --stc: #2266CC; }   /* тип реализации: по счёту — синяя, по договору — фиолетовая, розница — зелёная, интернет-заказ — оранжевая */
.chip.sk-con { --stc: #8A63D2; }
.chip.sk-ret { --stc: #199948; }
.chip.sk-web { --stc: #CC6E19; }
.chip.sl-new { --stc: #7B828C; }   /* статус реализации: оформляется — серая, подтверждена — оранжевая, отгружена — бирюзовая, закрыта — синяя */
.chip.sl-ok { --stc: #CC6E19; }
.chip.sl-ship { --stc: #0E9AA7; }
.chip.sl-done { --stc: #2266CC; }
.stg .cl { fill: var(--stc); }
.stg .glow { opacity: .55; }   /* размытая метка поверх тонировки стекла — цвет проступает сквозь плашку */
.chip.dc { position: relative; width: 176px; height: 24px; padding: 5px 8px 0 38px; border: 0; border-radius: 0; background: none; justify-content: flex-start; font-size: 12px; font-weight: 700; text-transform: lowercase; color: var(--fg); flex: none; }
.chip.dc .stg { position: absolute; left: 0; top: 0; width: 176px; height: 24px; overflow: visible; pointer-events: none; }
.chip.dc .tx { position: relative; line-height: 19px; }
.stg .bk { fill: url(#gi-back); }
.stg .bl { filter: url(#st-blur); }
.stg .sh { fill: rgba(0, 0, 0, .22); filter: url(#st-soft); }
.stg .base { fill: var(--surface); }
.stg .tint { fill: url(#gi-glass); }
.stg .edge { fill: none; stroke: rgba(255, 255, 255, .9); stroke-width: 2; }
:root[data-theme="dark"] .stg .bk { fill: url(#gi-back-i); }
:root[data-theme="dark"] .stg .sh { fill: rgba(0, 0, 0, .6); }
:root[data-theme="dark"] .stg .tint { fill: url(#gi-glass-i); }
:root[data-theme="dark"] .stg .edge { stroke: rgba(255, 255, 255, .42); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.fg { background: var(--fg); }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line); display: grid; place-items: center; font-size: 9px; font-weight: 600; color: var(--fg-2); flex: none; letter-spacing: .02em; position: relative; }
.av.lg { width: 30px; height: 30px; font-size: 11px; }
.av .on { position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--surface); }
.avs { display: flex; }
.avs .av { margin-left: -6px; border: 2px solid var(--surface); }
.avs .av:first-child { margin-left: 0; }
.avs .av.more { font-size: 8.5px; color: var(--mute); }
.pg-ics { display: inline-flex; gap: 3px; }
.pg-ics span { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--surface-2); background: var(--surface-2); }
.pg-ics span.no { opacity: .22; }

/* тик-прогресс (образец -49) */
.ticks { display: inline-flex; gap: 2px; align-items: center; }
.ticks i { display: block; width: 3px; height: 10px; border-radius: 1.5px; background: var(--line-2); }
.ticks i.on { background: var(--ok); opacity: var(--o); animation: fade-in .3s ease-out backwards; animation-delay: calc(var(--j, 0) * 18ms); }
.ticks.fg i.on { background: var(--fg); }
.ticks.sm { gap: 2px; } .ticks.sm i { width: 2px; height: 9px; }
.xp-head .b { white-space: nowrap; }

/* дорожная карта (образец -50) */
.rm { display: flex; flex-direction: column; }
.rm-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 5px; }
.rm-head .t { font-weight: 600; white-space: nowrap; }
.rm-head .n { color: var(--mute); font-size: 11px; white-space: nowrap; }
.rm-step { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.rm-ic { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 9px; color: var(--mute); flex: none; background: var(--surface); }
.rm-step.done .rm-ic { background: var(--ok); border-color: var(--ok); color: #fff; }
.rm-step.cur .rm-ic { border-color: transparent; color: var(--fg); }
.rm-step.cur .rm-name { font-weight: 600; }
.rm-step.pend .rm-name { color: var(--fg-2); }
.rm-step.bad .rm-ic { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.rm-name { flex: 1; min-width: 0; }
.rm-time { color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }
.rm-foot { margin-top: 7px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.rm-foot .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--fg-2); }
.rm-foot .t { font-weight: 600; font-size: 11.5px; }
.rm-foot .s { color: var(--mute); font-size: 11px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .9s linear infinite; }

/* списки-таблицы (строки — div, чтобы раскрываться поверх соседей) */
.tbl { display: flex; flex-direction: column; }
.tr { display: grid; align-items: center; gap: 8px; padding: 0 8px; min-height: 35px; border-radius: 8px; }
.tr > * { min-width: 0; }
.tr.th { min-height: 24px; font-size: 10.5px; color: var(--mute); font-weight: 500; }
.tr.clickable { cursor: pointer; }
.tr.clickable { transition: background .15s ease; }
.tr.clickable:hover { background: var(--surface-2); }
.tr.sel { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--fg); }
.tr .t { font-weight: 500; }
.tr .s { color: var(--mute); font-size: 10.5px; }
.tbl > * + * { border-top: 1px solid var(--line); }
.tbl > .th + * { border-top: 0; }
.tbl .tr:not(.th) { border-radius: 0; }
.trw .tr.sel { box-shadow: inset 2px 0 0 var(--fg); }

/* Снабжение: один модуль во всю высоту, список прокручивается внутри, шапка списка липкая */
.grid.single { display: flex; }
.grid.single > .mod { flex: 1; min-height: 0; }
.mod.fill .mod-surface { display: flex; flex-direction: column; min-height: 0; }
/* список записей: полоса прокрутки видна всегда, тонкая (7px — на треть уже прежней), бегунок цвета тёмной заливки меню */
.sup-list { flex: 1; min-height: 0; overflow-x: auto; overflow-y: scroll; scrollbar-gutter: stable; scrollbar-color: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 6px 2px 2px; scroll-behavior: smooth; }
/* scrollbar-color наследуется от сетки; при любом значении кроме auto Chrome игнорирует ::-webkit-scrollbar — потому auto выше */
.sup-list::-webkit-scrollbar { width: 7px; height: 7px; }
.sup-list::-webkit-scrollbar-track { background: var(--surface-3); border-radius: 4px; }
.sup-list::-webkit-scrollbar-thumb { background: var(--frame); border-radius: 4px; }
:root[data-theme="dark"] .sup-list::-webkit-scrollbar-thumb { background: var(--line-2); }
@supports not selector(::-webkit-scrollbar) { .sup-list { scrollbar-width: thin; scrollbar-color: var(--frame) var(--surface-3); } }
.sup-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.recs { display: flex; flex-direction: column; gap: 8px; }
/* 29-й круг: когда даже сжатые комментарий и ИНН не помещаются (окно уже ~1380px), строки не обрезаются, а список прокручивается по горизонтали */
.sup-list > .sup-head, .sup-list > .wh-head, .sup-list > .recs { min-width: min-content; }
/* склад (30-й круг): строка — две карточки в ряд с отступом 16px (позиция | остаток), шапка из двух таких же блоков, липкая целиком */
.wh-row, .wh-head { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; }
.wh-head { position: sticky; top: 0; z-index: 2; }
.wh-head > .sup-head { position: static; }
.wh-row .tr { min-height: 34px; }
.tr .rn { text-align: right; white-space: nowrap; }
/* запись — один контейнер с одной рамкой (без подложки, как у модуля: двойная рамка — перебор) */
.rec { background: transparent; border-radius: 10px; padding: 0; }
.rec-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s ease, box-shadow .2s ease; }
.rec .no { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }   /* № заказа и № заявки — один шрифт и жирность */
.tr .r { text-align: right; padding-right: 10px; }  /* даты и время — по правому краю поля, с отступом от следующей колонки */
.hp.r .hp-pop { left: auto; right: 0; }
.rec:hover .rec-card { border-color: var(--line-2); }
.rec.open .rec-card { border-color: var(--fg); }
.rec .tr { min-height: 34px; border-radius: 9px; }   /* одна строка текста: до рамки контейнера 6px от самого высокого элемента (кнопка контакта 22px) */
.rec .tr.clickable { transition: background .15s ease; }
.tr.clickable:hover { background: var(--surface-2); }
/* всплывающие по наведению: история статусов и контакт поставщика */
.hp { position: relative; display: inline-flex; align-items: center; }
.hp-trg { border-bottom: 1px dashed var(--line-2); cursor: default; }
.hp-pop { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 70; background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow); padding: 8px 10px; min-width: 190px; white-space: nowrap; font-size: 11.5px; }
.hp-pop.up { top: auto; bottom: calc(100% + 6px); }
.hp:hover { z-index: 70; }
.hp:hover .hp-pop { display: block; opacity: var(--o); animation: fade-in .14s ease-out; }
.ic-btn { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--surface-2); display: grid; place-items: center; cursor: default; }
/* поставщик: ИНН перед названием, по правому краю своей колонки, в одну строку */
/* список «Снабжения» (26-й круг): между столбцами 4px, поля у рамки записи прежние 8px; ИНН — свой столбец по правому краю, при сужении сжимается вторым и обрезается многоточием */
.sup-list .tr { gap: 4px; }
.sup-list .tr > .gl { padding-left: 4px; }    /* 27-й круг: в отмеченных местах зазор 8px — поле ячейки 4px плюс общий 4px */
.sup-list .tr > .gr { padding-right: 4px; }
.sup-head .tr.th > div { text-align: center; padding-left: 0; padding-right: 0; }   /* заголовки — по центру всей ширины столбца */
.tr .inn { container-type: inline-size; text-align: right; color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; overflow: hidden; }
.tr .inn > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@container (max-width: 36px) { .tr .inn > span { visibility: hidden; } }   /* сжатый почти в ноль ИНН не оставляет обрывка цифр */
.tr.th .inn { font-size: inherit; }
.tr .hp.r { padding-right: 0; }   /* отступ справа уже у ячейки даты; второй у триггера истории съедал 10px и переносил дату на две строки */
.hp-trg { white-space: nowrap; }
.xp-panel.under { top: calc(100% + 6px); left: 0; right: 0; }
.files { display: flex; flex-direction: column; gap: 4px; }
.file { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 11.5px; }
.file .fi { display: grid; place-items: center; color: var(--surface-2); }
.items .tr { padding: 0 6px; }
/* карточка заказа (28-й круг): строка полей заказа, под ней два блока поровну — документы и позиции */
.of-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) minmax(0, .9fr) minmax(0, .9fr) minmax(0, .95fr) minmax(0, 1.45fr) minmax(0, 1.9fr); gap: 8px; align-items: end; margin-bottom: 10px; }
.of-row .fl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* подписи в одну строку: в узком окне не ломают ряд */
.oc-blocks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: stretch; }
.oc-block { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 10px; min-width: 0; }
.oc-block .oc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 23px; margin-bottom: 6px; }
.oc-block .oc-h .sec-t { margin: 0; }

/* сводка */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 7px; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.kpi b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--mute); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.kpi.bad b { color: var(--bad); }
.dirbars { display: flex; flex-direction: column; gap: 5px; }
.dirbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 11px; }
.dirbar .n { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* тайлы */
.tiles { display: grid; gap: 7px; }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.tile .t { font-weight: 600; font-size: 11.5px; }
.tile .s { color: var(--mute); font-size: 10.5px; }

/* карта подразделений (общие службы на все направления и раздельный учёт) */
.dmap { display: grid; grid-template-columns: 128px repeat(3, 1fr); gap: 5px; }
.dmap .hd { font-size: 10.5px; color: var(--mute); padding: 3px 7px; font-weight: 500; }
.dmap .hd.dir { display: flex; align-items: center; gap: 5px; }
.dmap .rl { display: flex; align-items: center; gap: 7px; padding: 0 7px; font-weight: 500; font-size: 11.5px; }
.dcell { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-height: 40px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.dcell { transition: border-color .15s ease, background .15s ease; }
.dcell:hover { border-color: var(--line-2); background: var(--surface-3); }
.dcell.shared { grid-column: span 3; background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface-3) 10px 11px); flex-direction: row; align-items: center; gap: 10px; }
.dcell .t { font-weight: 600; font-size: 11.5px; }
.dcell .s { color: var(--mute); font-size: 10.5px; }
.dcell.sel { border-color: var(--fg); }

/* чат страницы */
.chat { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 7px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.chat-msgs { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; padding: 8px 2px; display: flex; flex-direction: column; gap: 8px; }   /* место под полосу зарезервировано: появление полосы не меняет ширину пузырей */
.msg { display: flex; gap: 7px; align-items: flex-end; }
.msg .av { margin-bottom: 2px; }
.msg-b { max-width: 82%; }
.msg-meta { font-size: 10px; color: var(--mute); margin: 0 0 2px 2px; display: flex; gap: 5px; }
.msg-t { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; border-bottom-left-radius: 4px; padding: 6px 9px; font-size: 11.5px; line-height: 1.4; }
.msg.me { flex-direction: row-reverse; }
.msg.me .msg-b { display: flex; flex-direction: column; align-items: flex-end; }
.msg.me .msg-t { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); border-radius: 10px; border-bottom-right-radius: 4px; }
.msg.sys { justify-content: center; }
.msg.sys .msg-t { background: transparent; border: 0; color: var(--mute); font-size: 10.5px; padding: 2px 0; }
.typing { font-size: 10.5px; color: var(--mute); display: flex; align-items: center; gap: 5px; height: 14px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--mute); display: inline-block; animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chat-form { display: flex; gap: 5px; padding-top: 8px; border-top: 1px solid var(--line); }
.chat-in { flex: 1; min-width: 0; height: 29px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 9px; background: var(--surface); color: var(--fg); outline: 0; }
.chat-in:focus { border-color: var(--fg); }

/* ---------- раскрытие поверх соседей + блюр-фокус (образец -49 и правило владельца) ---------- */
.xp { position: relative; }
.xp-head { cursor: pointer; }
.xp-panel { display: none; position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); }
.xp.open { z-index: 60; }
.xp.open > .xp-panel { display: block; opacity: var(--o); animation: fade-in .16s ease-out; }
.xp.open.closing > .xp-panel { animation: fade-out .12s ease-in forwards; pointer-events: none; }
.xp.open > .xp-panel.chat-pop { display: flex; animation-duration: .2s; }
.xp.open.closing > .xp-panel.chat-pop { animation-duration: .14s; }
.xp-panel.over { top: -1px; left: -1px; right: -1px; }
.xp-panel.over-wide { top: -6px; left: -6px; right: -6px; }
.xp-panel.below { top: calc(100% + 5px); left: 0; min-width: 100%; }
.xp-panel.below-r { top: calc(100% + 5px); right: 0; }
.xp-panel.side-up { bottom: 0; left: 0; right: 0; }
.xp-panel.roles-panel { left: auto; right: -6px; }
.xp-panel.tasks-panel { left: auto; right: -6px; width: max(calc(100% + 12px), 320px); }
/* Все появления — только прозрачностью и через зарегистрированное свойство --o (opacity: var(--o)).
   Прямая анимация opacity/transform уходит в композитор: элемент на время получает отдельный слой, а по окончании
   перерисовывается на своём месте — иконки и текст на дробных позициях «прыгают» на доли пикселя (правка владельца 05.10.2026).
   Анимация переменной идёт в основном потоке, слоя нет, пиксели до и после одинаковые. */
@property --o { syntax: '<number>'; inherits: false; initial-value: 1; }
@keyframes fade-in { from { --o: 0; } }
@keyframes fade-out { to { --o: 0; } }
.veil {
  position: absolute; inset: 0; border-radius: inherit; z-index: 50;
  background: var(--veil);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  opacity: 0; pointer-events: none; transition: opacity .26s ease;
}
.veil.on { opacity: 1; pointer-events: auto; }

/* наполнение раскрытых панелей */
.xp-panel .ph { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.xp-panel .ph .t { font-weight: 600; }
.xp-panel .pb { padding: 8px 10px 10px; }
.xp-panel .pf { display: flex; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--line); }
.menu { display: flex; flex-direction: column; padding: 5px; }
.menu button { display: flex; align-items: center; gap: 8px; height: 29px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--fg); cursor: pointer; text-align: left; width: 100%; }
.menu button:hover { background: var(--surface-2); }
.menu button.on { background: var(--surface-2); font-weight: 600; }
.menu button .chk { margin-left: auto; color: var(--fg); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 4px; }
.menu .lbl { font-size: 10px; color: var(--mute); padding: 5px 8px 3px; letter-spacing: .06em; text-transform: uppercase; }
.steps { display: flex; flex-direction: column; }
.steps .st { display: flex; align-items: center; gap: 8px; min-height: 29px; padding: 4px 4px; border-radius: 7px; line-height: 1.3; }
.steps .st:hover { background: var(--surface-2); }
.steps .st .ic { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 600; border: 1.5px solid var(--line-2); color: var(--mute); flex: none; }
.steps .st.done .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps .st.cur .ic { background: var(--fg); border-color: var(--fg); color: var(--panel); }
.steps .st.done .n { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--line-2); }
.steps .st .n { flex: 1; min-width: 0; }
.steps .st .chev { color: var(--mute); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; font-size: 11.5px; }
.kv dt { color: var(--mute); } .kv dd { margin: 0; }
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.sec-t { font-size: 10px; color: var(--mute); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 5px; }
.doc { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 7px; border: 1px solid var(--line); border-radius: 7px; font-size: 11px; background: var(--surface-2); }
.docs { display: flex; flex-direction: column; gap: 4px; }
.matrix { display: grid; gap: 4px; font-size: 11px; align-items: center; }
.matrix .mh { color: var(--mute); font-size: 10px; text-align: center; }
.matrix .mr { font-weight: 500; }
.matrix .mc { height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--fg); }
.matrix .mc.no { opacity: .3; }
.matrix .mc.view { color: var(--mute); font-size: 9.5px; }

/* форма новой записи (под кнопкой в шапке) */
.frm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fl { font-size: 10.5px; color: var(--mute); }
.in { width: 100%; height: 28px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 9px; background: var(--surface); color: var(--fg); font: inherit; outline: 0; }
.in:focus { border-color: var(--fg); }
.in::placeholder { color: var(--mute); }
textarea.in { height: auto; min-height: 128px; padding: 6px 9px; resize: vertical; line-height: 1.4; overflow-x: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
/* кастомный выпадающий список: кнопка как поле ввода, список — как меню */
.csel { position: relative; }
.sel-btn { display: flex; align-items: center; gap: 6px; text-align: left; cursor: pointer; }
.sel-btn .lbl { flex: 1; min-width: 0; }
.csel.open .sel-btn { border-color: var(--fg); }
.csel > .xp-panel { padding: 0; }   /* отступы даёт .menu внутри панели */
.sel-btn .lbl.ph { color: var(--mute); }
/* выпадающий календарь (dsel в ui.js): неделя с понедельника, 6 недель, выходные приглушены, сегодня — обводка, выбранный — заливка */
.csel.cal > .xp-panel { min-width: 252px; }
.cal-p { padding: 8px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-h .t { font-weight: 600; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-g .wd { height: 20px; line-height: 20px; text-align: center; font-size: 10px; color: var(--mute); }
.cal-g button { height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--fg); font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; transition: background .15s ease; }
.cal-g button:hover { background: var(--surface-2); }
.cal-g button.we { color: var(--fg-2); }
.cal-g button.out { color: var(--mute); opacity: .55; }
.cal-g button.today { box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; }
.cal-g button.on { background: var(--primary); color: var(--primary-fg); font-weight: 600; box-shadow: none; }
.cal-f { display: flex; justify-content: space-between; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
input[type="date"].in { font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] input[type="date"].in { color-scheme: dark; }

/* уведомления: список в панели, как чат */
.ntf { display: flex; gap: 9px; align-items: flex-start; padding: 8px; border-radius: 9px; }
.ntf.unread { background: var(--surface-2); }
.ntf .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--surface-2); flex: none; }
.ntf.unread .ic { background: var(--surface); }
.ntf .t { font-size: 11.5px; line-height: 1.35; }
.ntf .m { font-size: 10.5px; color: var(--mute); margin-top: 2px; }
.ntf .m a { color: var(--fg-2); text-decoration: none; border-bottom: 1px dashed var(--line-2); }
.ntf .dot { margin-top: 6px; }

/* заглушка страниц, которые ещё не спроектированы */
.stub { display: flex; flex-direction: column; gap: 8px; padding: 22px 18px; align-items: flex-start; }
.stub h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.stub p { margin: 0; color: var(--fg-2); max-width: 560px; }
.stub ul { margin: 5px 0 0; padding-left: 16px; color: var(--fg-2); display: grid; gap: 3px; }

/* ---------- появление элементов (каскадом) и переходы между страницами ---------- */
/* каскад появления: быстрое затухание без сдвига (fade-in через --o, см. выше); fill-mode backwards, не both —
   заполнение вперёд навсегда оставляло бы элемент контекстом наложения, и раскрытие внутри модуля не поднималось над вуалью */
.ani { opacity: var(--o); animation: fade-in .2s ease-out backwards; animation-delay: calc(var(--d, 0ms) + var(--i, 0) * 20ms); }
.chat-msgs .msg.ani { --d: 60ms; }
/* View Transitions: страница уезжает и въезжает, белая плитка активного раздела переезжает по колонке */
html.vt-nav #grid { view-transition-name: page; }
html.vt-nav .dk-item.active { view-transition-name: nav; }
/* иконка страницы в шапке: своя группа, старая не показывается, новая без анимации — мгновенная смена на своём месте, без наложения двух фигур */
html.vt-nav .tb-ic { view-transition-name: tbic; }
::view-transition-old(tbic) { display: none; }
::view-transition-new(tbic) { animation: none; }
/* страница: встроенное перекрёстное затухание без сдвига (старый снимок гаснет, новый проявляется на том же месте) */
::view-transition-group(page) { animation-duration: .24s; }
::view-transition-group(nav) { animation-duration: .3s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
/* смена темы: новая тема раскрывается кругом от кнопки */
html.vt-theme::view-transition-old(root) { animation: none; mix-blend-mode: normal; }
html.vt-theme::view-transition-new(root) { animation: reveal .55s ease-in both; mix-blend-mode: normal; }
@keyframes reveal { from { clip-path: circle(0px at var(--vt-x, 50%) var(--vt-y, 50%)); } to { clip-path: circle(var(--vt-r, 150vmax) at var(--vt-x, 50%) var(--vt-y, 50%)); } }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- линейка ширины окна (25-й круг, RULER в ui.js): поверх всего, на 30 % высоты от нижнего края, клики проходят сквозь;
   деления 10 / 50 / 100 px от левого края окна в CSS-пикселях; Alt+R прячет и показывает ---------- */
.ruler { position: fixed; left: 0; right: 0; bottom: 30vh; height: 28px; z-index: 9999; pointer-events: none; color: rgba(255, 255, 255, .9);
  font: 600 9px/1 "SN Pro", "SN Pro Local", Inter, Arial, sans-serif; font-variant-numeric: tabular-nums;
  background:
    repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 100px) 0 0 / 100% 12px no-repeat,
    repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 50px) 0 0 / 100% 8px no-repeat,
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .55) 0 1px, transparent 1px 10px) 0 0 / 100% 4px no-repeat,
    rgba(17, 17, 17, .74);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .16); }
html.ruler-off .ruler { display: none; }
.ruler .n { position: absolute; top: 15px; margin-left: 3px; }
.ruler .pm { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #CC6E19; }
.ruler .pm span { position: absolute; bottom: calc(100% + 4px); right: -1px; white-space: nowrap; padding: 4px 7px; border-radius: 6px; background: rgba(17, 17, 17, .82); color: #fff; font-size: 10px; }
.ruler .pm.hit { background: #199948; }
.ruler .pm.hit span { background: #199948; }
.ruler .rd { position: absolute; bottom: calc(100% + 4px); left: 12px; white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: rgba(17, 17, 17, .82); color: #fff; font-size: 10.5px; }
.ruler .rd.hit { background: #199948; }

/* ---------- производство (31-й круг): вкладки «Рецепты / Заказы», дерево состава (матрёшка), итоги себестоимости ---------- */
.seg-row { display: flex; align-items: center; gap: 12px; flex: none; padding: 2px 2px 8px; min-width: 0; }
.seg-row > .mute { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--fg-2); font: inherit; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .08); }
.seg button .n { font-size: 10.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
/* уровни вложенности рецепта — стопка квадратиков, как матрёшка */
.nest { display: inline-flex; gap: 2px; vertical-align: middle; }
.nest i { width: 6px; height: 6px; border-radius: 2px; background: var(--fg-2); opacity: .75; }
.nest i + i { opacity: .5; } .nest i + i + i { opacity: .3; }
/* дерево состава: отступ по уровню, направляющая линия, полуфабрикат сворачивается */
.tree .tnode .tname { display: flex; align-items: center; gap: 6px; padding-left: calc(var(--lv, 0) * 18px); }
.tree .tnode:not(.semi) .tname { padding-left: calc(var(--lv, 0) * 18px + 22px); }
.tree .tkids .tnode .tname { background: linear-gradient(var(--line-2), var(--line-2)) no-repeat calc(var(--lv, 0) * 18px - 9px) 0 / 1px 100%; }
.tree .tnode.semi { font-weight: 600; }
.tree .tdot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); flex: none; }
.tree .tg { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border: 0; border-radius: 4px; background: var(--surface-2); color: var(--fg-2); cursor: pointer; padding: 0; }
.tree .tg:hover { background: var(--surface-3); }
.tree .tgroup.closed > .tkids { display: none; }
.tree .tgroup.closed > .tnode .tg svg { transform: rotate(-90deg); }
.lnk { border: 0; background: none; padding: 0; font: inherit; color: var(--fg); text-decoration: underline dashed var(--line-2); text-underline-offset: 3px; cursor: pointer; }
.lnk:hover { text-decoration-color: var(--fg); }
.ph .lnk { color: var(--fg-2); }
.bad-t { color: var(--bad); }
.cost-sum { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.cost-sum.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cost-sum > div { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.cost-sum span { font-size: 10px; color: var(--mute); }
.cost-sum b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cost-sum .tot { background: var(--surface-2); }
.of-row.pz { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr); }

/* продажи (32-й круг): карточка реализации — строка общих полей и строка полей по типу (число колонок задаётся на месте);
   поля формы, не относящиеся к выбранному типу, скрыты; добавление позиции — строка под таблицей; связанные документы — чипы-ссылки */
.of-row.sl { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.6fr); }
.of-row.sl2 { grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); }
.frm .fld.off { display: none; }
.tr .shr { container-type: inline-size; overflow: hidden; }   /* основание в списке реализаций: сжимается вторым после комментария; уже 36px — прячется целиком, как ИНН */
.tr .shr > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@container (max-width: 36px) { .tr .shr > span { visibility: hidden; } }
.item-add { display: grid; grid-template-columns: minmax(0, 1fr) 76px 96px auto; gap: 6px; align-items: end; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.item-add .fl { white-space: nowrap; }
.tbl.items .rm { width: 20px; height: 20px; color: var(--mute); }
.tbl.items .rm:hover { color: var(--bad); }
.lnks { display: flex; flex-wrap: wrap; gap: 6px; }
.lnks .chip { cursor: pointer; }
.lnks .chip:hover { border-color: var(--fg); color: var(--fg); }

/* ============================================================
   RIVA · страница «Обзор» в новом дизайне (33-й круг, отдельный файл).
   Поверх базовых токенов и оболочки прототипа: стеклянные плитки этапов,
   поток документов по направлениям, деньги, цеха и склады, сегодня и неделя, команда.
   ============================================================ */

/* ---------- шапка: дата данных и быстрые действия ---------- */
.tb-date { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg-2); font-size: 11.5px; white-space: nowrap; }
.tb-date .num { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
.tb-date .live { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }

/* ---------- модули обзора ---------- */
.ov .mod-surface { padding: 12px 14px 12px; }
.ov-h { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 10px; }
.ov-h .sec-t { margin: 0; }
.ov-h .sub { color: var(--mute); font-size: 10.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 600; white-space: nowrap; }

/* ---------- поток предприятия: плитки этапов и дорожки направлений ---------- */
.ov-flow { display: grid; grid-template-columns: 124px repeat(5, 176px minmax(14px, 1fr)) 176px; align-items: center; row-gap: 6px; }
.ov-flow > .lbl { font-size: 10.5px; color: var(--mute); padding-right: 10px; line-height: 1.3; }
.ov-flow > .lbl b { display: block; color: var(--fg-2); font-weight: 600; font-size: 11px; }
/* плитка этапа: задняя фигура 34×34 в углу, метка 12×16 под стеклом, стеклянная плашка 166×78 со сдвигом (10, 10) — приём чипов статуса, крупнее */
.tile { position: relative; width: 176px; height: 88px; cursor: pointer; border-radius: 13px; }
.tile .stg { position: absolute; left: 0; top: 0; width: 176px; height: 88px; overflow: visible; pointer-events: none; }
.tile .tx { position: absolute; left: 58px; top: 13px; right: 12px; display: flex; flex-direction: column; min-width: 0; }
.tile .n { font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--fg); display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.tile .n small { font-size: 10.5px; font-weight: 500; color: var(--mute); letter-spacing: 0; }
/* подпись плитки — до двух строк под числом, точка состояния в начале строки */
.tile .s { position: absolute; left: 16px; right: 12px; bottom: 8px; font-size: 10px; line-height: 1.2; color: var(--mute); display: block; overflow: hidden; max-height: 24px; }
.tile .s span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .s .dot { display: inline-block; vertical-align: 1px; margin-right: 4px; float: left; margin-top: 3px; }
.tile:hover .stg .edge { stroke: var(--fg); }
.tile.on .stg .edge { stroke: var(--fg); stroke-width: 2.5; }
.stg .bl2 { filter: url(#tl-blur); }
/* метки этапов: реализации — синяя, снабжение — оранжевая, склад — зелёная, производство — фиолетовая, отгрузки — бирюзовая, оплаты — изумрудная */
.tile.t-sales { --stc: #2266CC; } .tile.t-supply { --stc: #CC6E19; } .tile.t-stock { --stc: #199948; }
.tile.t-prod { --stc: #8A63D2; } .tile.t-ship { --stc: #0E9AA7; } .tile.t-pay { --stc: #1F9D6B; }
/* соединители: штриховая линия со стрелкой; медленное течение штрихов — только без «уменьшить движение» */
.conn { position: relative; height: 84px; min-width: 0; }
.conn svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.conn .ln { stroke: var(--line-2); stroke-width: 1.2; fill: none; }
.conn .fl { stroke: var(--fg-2); stroke-width: 1.2; fill: none; stroke-dasharray: 3 9; opacity: .45; animation: conn-flow 9s linear infinite; }
.conn .ar { fill: var(--line-2); }
.conn .nn { fill: var(--mute); font-size: 9.5px; font-variant-numeric: tabular-nums; }
@keyframes conn-flow { to { stroke-dashoffset: -120; } }
/* дорожки направлений */
.lane-c { height: 30px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: default; position: relative; }
.lane-c.z { color: var(--mute); font-weight: 500; background: transparent; }
.lane-c .hp-pop { font-weight: 400; left: 50%; transform: translateX(-50%); }
.lane-c .hp-pop .row { min-height: 24px; gap: 8px; }
.lane-c .hp-pop .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.lane-x { height: 30px; position: relative; }
.lane-x::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 1px dotted var(--line); }
.ov-flow .chip.dir { height: 20px; }
/* раскрытие этапа под потоком: таблица документов */
.stage-panel { margin-top: 10px; }
.stage-panel .tr { min-height: 30px; gap: 8px; }
.stage-panel .tr.th { min-height: 22px; }

/* ---------- требует внимания ---------- */
.att { display: flex; flex-direction: column; gap: 4px; }
.att a { display: grid; grid-template-columns: 6px 28px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-height: 40px; padding: 4px 8px 4px 8px; border-radius: 9px; text-decoration: none; color: inherit; border: 1px solid transparent; transition: background .15s ease, border-color .15s ease; }
.att a:hover { background: var(--surface-2); border-color: var(--line); }
.att .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--surface-2); }
.att .t { font-size: 11.5px; line-height: 1.3; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.att .m { font-size: 10.5px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .no { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--fg-2); }
.att .more { font-size: 10.5px; color: var(--mute); padding: 6px 8px 0; }
.dirs .foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10.5px; color: var(--mute); padding: 8px 4px 0; }
.dirs .foot b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- деньги ---------- */
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 7px; background: var(--card); min-width: 0; }
.stat .v { font-size: 18px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 10.5px; color: var(--mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s.bad { color: var(--bad); }
/* план денег на две недели: столбцы вверх — поступления, вниз — выплаты; сегодня — первая колонка с вертикальной отметкой */
.cash { margin-top: 10px; }
.cash .cols { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.cash .col { display: grid; grid-template-rows: 46px 46px 14px; min-width: 0; position: relative; }
.cash .col.td::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 14px; border-left: 1px dashed var(--line-2); }
.cash .up, .cash .dn { position: relative; }
.cash .up { border-bottom: 1px solid var(--line-2); }
.cash .up i, .cash .dn i { position: absolute; left: 18%; right: 18%; border-radius: 2px; }
.cash .up i { bottom: 0; background: var(--ok); opacity: .85; }
.cash .dn i { top: 0; background: var(--bad); opacity: .7; }
.cash .up b, .cash .dn b { position: absolute; left: -8px; right: -8px; text-align: center; font-size: 9px; font-weight: 500; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cash .dl { font-size: 9.5px; color: var(--mute); text-align: center; font-variant-numeric: tabular-nums; align-self: end; }
.cash .col.td .dl { color: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; color: var(--mute); margin-top: 6px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
/* крупнейшие должники под графиком */
.debt { display: flex; flex-direction: column; margin-top: 8px; }
.debt .row { min-height: 26px; gap: 8px; font-size: 11px; border-top: 1px solid var(--line); }
.debt .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.debt .row .v { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.debt .row .s { color: var(--mute); font-size: 10px; white-space: nowrap; }

/* ---------- цеха и склады по направлениям ---------- */
.dirs { display: flex; flex-direction: column; gap: 6px; }
.dr { display: grid; grid-template-columns: 112px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.dr .dh { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dr .dh .s { font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr .cell { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dr .cell .r1 { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.dr .cell .r1 .pct { color: var(--mute); font-weight: 500; }
.dr .cell .r1 .pct.bad { color: var(--bad); }
.dr .cell .r2 { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.bar { position: relative; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--fg); }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.bar i.over { right: 0; left: auto; width: 2px; background: var(--bad); border-radius: 0; }
.chip.xs { height: 16px; font-size: 9.5px; padding: 0 5px; }

/* ---------- сегодня и неделя ---------- */
.tw { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; }
.tl { display: flex; flex-direction: column; }
.tl .ev { display: grid; grid-template-columns: 36px 26px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 36px; padding: 3px 4px; border-radius: 8px; }
.tl .ev:hover { background: var(--surface-2); }
.tl .ev + .ev { border-top: 1px solid var(--line); }
.tl .tm { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tl .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--surface-2); }
.tl .t { font-size: 11.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .m { font-size: 10.5px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wk .d { border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 6px 6px 7px; min-height: 150px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wk .d.td { border-color: var(--fg); }
.wk .d.we { background: transparent; }
.wk .dh { display: flex; align-items: baseline; gap: 4px; margin-bottom: 3px; }
.wk .dh b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wk .dh span { font-size: 10px; color: var(--mute); text-transform: lowercase; }
.wk .d.td .dh span { color: var(--fg); font-weight: 600; }
.wk .it { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; line-height: 1.25; padding: 3px 6px 4px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.wk .it .r { display: flex; align-items: center; gap: 5px; min-width: 0; }
.wk .it .dot { flex: none; }
.wk .it b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk .it .x { font-size: 10px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk .it.bad { border-color: var(--bad); }
.wk .it.bad .x { color: var(--bad); }
.wk .none { font-size: 10px; color: var(--mute); padding: 3px 2px; }

/* ---------- команда ---------- */
.team .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.team .kpi { padding: 7px 9px; background: var(--card); }
.team .kpi b { font-size: 16px; }
.team .kpi span { font-size: 10px; }
.team .row.p { min-height: 30px; gap: 8px; }
.team .row.p .nm { font-size: 11.5px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .row.p .s { font-size: 10.5px; color: var(--mute); white-space: nowrap; }
.team .adapt { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.team .adapt .ticks i { height: 8px; }

/* ---------- панель быстрых действий ---------- */
.qa { width: 260px; }
.qa .menu button .gi { flex: none; }

/* ---------- узкие окна: поток переходит в прокрутку, модули остаются ---------- */
@media (max-width: 1400px) {
  /* ноутбук 1280: подписи дорожек — только буква направления, соединители короче, показатели денег в два ряда */
  .ov-flow { grid-template-columns: 26px repeat(5, 176px minmax(5px, 1fr)) 176px; }

/* чип статуса заявки в приёме стеклянных иконок: задняя тёмная фигура 26×16 слева сверху и через 6px цветная метка статуса 10×16

   #st-blur, #st-soft в build.mjs (координаты в пространстве каждого чипа), цвета и тема — в style.css */
const markChip = (cls, text, w = 124) => {   // w: 124 — обычный, 136 — широкий (для «полуфабрикат», 31-й круг); у каждой ширины своя обрезка #st-clip / #st-clip-136
  const mark = cls => `<path class="cl bl${cls}" d="M32 6H42V11A5 5 0 0 1 32 11Z"/>`;   // метка 10×16, верх срезан на 6px (24-й круг): целиком под плашкой, видна только размытой
  const pw = w - 6, clip = w === 124 ? 'st-clip' : 'st-clip-' + w;

};
const stChip = st => markChip('st-' + st, SUP_ST[st][0]);
/* чип оплаты (29-й круг): та же конструкция, метка — зелёная «оплачено», красная «не оплачено» */

/* продажи (32-й круг): тип реализации — широкий чип («интернет-заказ» не входит в 124), статус — обычный;

const skChip = t => markChip(SALE_TYPE[t][1], SALE_TYPE[t][0], 136);

/* чип направления (шапка карточки заказа, 28-й круг): тот же приём, что у чипа статуса, крупнее в 1,2 раза и без цветной метки —

/* короткая подпись контакта: «Громова И. П.», общий контакт — как есть */

/* даты в данных — «дд.мм.гггг» и «дд.мм.гггг чч:мм»; показываем «04 ноября 2026» и «04 ноября 2026 / 08:20» (формат владельца) */
const MONTHS_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const fmtDate = s => { const m = /^(\d{2})\.(\d{2})\.(\d{4})/.exec(s || ''); return m ? `${m[1]} ${MONTHS_G[+m[2] - 1]} ${m[3]}` : (s || ''); };
const fmtDT = s => { const m = /^(\d{2}\.\d{2}\.\d{4}) (\d{2}:\d{2})$/.exec(s || ''); return m ? `${fmtDate(m[1])} / ${m[2]}` : fmtDate(s); };
const nowStamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
/* номер документа (заказ клиента, заявка): две буквы, «-», четыре цифры с 0001; после 9999 меняется вторая буква
   (после последней — первая, вторая снова с начала) и счёт идёт снова с 0001: ЗК-9999 → ЗЛ-0001 */
const NO_ABC = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ';
const noKey = s => { const m = /^(\S)(\S)-(\d{4})$/.exec(s || ''); return m ? (NO_ABC.indexOf(m[1]) * NO_ABC.length + NO_ABC.indexOf(m[2])) * 1e4 + +m[3] : -1; };
const nextNo = (list, start) => {
  const last = list.filter(s => noKey(s) >= 0).sort((a, b) => noKey(a) - noKey(b)).pop();
  if (!last) return start + '-0001';
  let a = last[0], b = last[1], n = +last.slice(3) + 1;
  if (n > 9999) { n = 1; let j = NO_ABC.indexOf(b) + 1; if (j >= NO_ABC.length) { j = 0; a = NO_ABC[(NO_ABC.indexOf(a) + 1) % NO_ABC.length]; } b = NO_ABC[j]; }
  return `${a}${b}-${String(n).padStart(4, '0')}`;
};
/* транспортные компании для формы заявки; «—» — ещё не выбрана */
const CARRIERS = ['—', 'ПЭК', 'Деловые Линии', 'СДЭК', 'КИТ', 'Байкал Сервис', 'Энергия', 'самовывоз'];
/* выпадающий календарь в стиле приложения: значение в скрытом поле (гггг-мм-дд), неделя с понедельника, всегда 6 недель — панель не меняет высоту */
const MONTHS_N = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const isoToRu = v => v ? v.split('-').reverse().join('.') : '';
const calHtml = (y, m, val) => {

    <div class="cal-g">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<span class="wd">${w}</span>`).join('')}${days}</div>

const dsel = (name, val = '') => {

const fileKind = name => /счет|счёт|invoice/i.test(name) ? 'счёт' : /договор|contract/i.test(name) ? 'договор' : /упд/i.test(name) ? 'УПД' : 'прочее';
/* поля форм */

/* модуль: поверхность сверху, подпись (название + описание) снизу */

/* раскрывающийся элемент: заголовок в потоке, панель — поверх соседей */
const xp = ({ id, head, panel, place = 'over', cls = '', headCls = '', data = '' }) =>
